<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caja Supermercado Prisma</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>🛒 Supermercado Prisma - Caja</h1>
    <div class="top-actions">
      <button id="btnNewCatalogItem" class="btn small">+ Producto</button>
      <button id="btnExportSales" class="btn small">📤 Ventas</button>
    </div>
  </header>

  <main class="pos-layout">
    <!-- Sección izquierda: carga y carrito -->
    <section class="pos-left">
      <div class="card pos-entry">
        <div class="pos-main-inputs">
          <input id="posBarcode" placeholder="Código o escáner..." autofocus />
          <input id="posQty" type="number" min="1" step="1" value="1" />
          <button id="posAdd" class="btn primary big">➕ Agregar</button>
        </div>
        <div class="pos-search">
          <input id="posSearchName" list="posNames" placeholder="Buscar por nombre..." />
          <datalist id="posNames"></datalist>
          <button id="posAddByName" class="btn">Agregar</button>
        </div>
      </div>

      <div class="card pos-cart">
        <table id="posTable">
          <thead>
            <tr>
              <th>Producto</th>
              <th class="num">Precio</th>
              <th class="num">Cant.</th>
              <th class="num">Subtotal</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- Sección derecha: totales y cobro -->
    <section class="pos-right card sticky">
      <div class="totals-box">
        <div class="totals-row"><span>Items</span><strong id="posItems">0</strong></div>
        <div class="totals-row"><span>Subtotal</span><strong id="posSubtotal">$0</strong></div>
        <div class="totals-row"><label class="chk"><input type="checkbox" id="posApplyIVA" checked> IVA 21%</label><strong id="posIVA">$0</strong></div>
        <div class="totals-row total"><span>Total</span><strong id="posTotal">$0</strong></div>
      </div>

      <div class="payment-box">
        <div class="field">
          <label>Medio de pago</label>
          <select id="posPaymentMethod">
            <option value="efectivo">Efectivo</option>
            <option value="tarjeta">Tarjeta</option>
            <option value="mp">Mercado Pago</option>
          </select>
        </div>
        <div class="field">
          <label>Importe recibido</label>
          <input id="posPaid" type="number" min="0" step="0.01" value="0" />
        </div>
        <div class="totals-row"><span>Vuelto</span><strong id="posChange">$0</strong></div>

        <div class="pos-actions">
          <button id="posCancel" class="btn ghost">🧹 Cancelar</button>
          <button id="posCharge" class="btn primary big">💰 Cobrar (F2)</button>
        </div>

        <label class="chk small"><input type="checkbox" id="posPrint" checked> Imprimir ticket</label>
      </div>
    </section>
  </main>

  <!-- Modal catálogo -->
  <dialog id="catalogModal">
    <form id="catalogForm" method="dialog" class="modal">
      <div class="modal-header">
        <h2 id="catalogTitle">Nuevo producto</h2>
        <button type="button" class="icon-btn" id="closeCatalog">✕</button>
      </div>
      <div class="grid-2">
        <div class="field"><label>Código</label><input id="catBarcode" /></div>
        <div class="field"><label>Nombre</label><input id="catName" required /></div>
        <div class="field"><label>Precio</label><input id="catPrice" type="number" step="0.01" min="0" /></div>
        <div class="field"><label>IVA</label>
          <select id="catTax">
            <option value="21">21%</option>
            <option value="10.5">10.5%</option>
            <option value="0">0%</option>
          </select>
        </div>
      </div>
      <menu class="modal-actions">
        <button type="reset" class="btn ghost">Limpiar</button>
        <button type="submit" class="btn primary">Guardar</button>
      </menu>
      <input type="hidden" id="catalogId" />
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
